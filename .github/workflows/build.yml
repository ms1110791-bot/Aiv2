name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP अनज़िप करो
        run: |
          ZIP="$(ls -t ./*.zip | head -n 1)"
          echo "Using: $ZIP"
          unzip -o "$ZIP" -d work
          DIR="$(dirname "$(find work -name settings.gradle.kts | head -n 1)")"
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AIHelper-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
